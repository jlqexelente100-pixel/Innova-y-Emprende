{% extends "base.html" %}

{% block title %}Editar Perfil{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='styles/editar_perfil.css') }}">
<style>
.page-hero {
    background: linear-gradient(135deg, var(--brand-deep) 0%, var(--brand-primary) 55%, var(--brand-mid) 100%);
    border-radius: var(--radius-lg);
    padding: 2rem 2.5rem;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    margin-bottom: 2rem;
    box-shadow: var(--shadow-md);
    position: relative;
    overflow: hidden;
}
.page-hero::after {
    content: "";
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--brand-mid), var(--brand-light));
}
.page-hero h2 { font-size: 1.6rem; font-weight: 900; margin: 0; }
.page-hero p  { margin: .3rem 0 0; opacity: .8; font-size: .92rem; }
.page-hero-btn {
    background: rgba(255,255,255,.15);
    color: #fff;
    font-weight: 600;
    border: 1.5px solid rgba(255,255,255,.4);
    padding: .55rem 1.2rem;
    border-radius: var(--radius-sm);
    text-decoration: none;
    font-size: .88rem;
    transition: var(--transition-fast);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: .4rem;
}
.page-hero-btn:hover {
    background: rgba(255,255,255,.25);
    color: #fff;
    border-color: rgba(255,255,255,.7);
}
</style>
{% endblock %}

{% block content %}
<div class="container-fluid mt-4 px-2 px-md-3">

    <!-- Hero -->
    <div class="page-hero">
        <div>
            <h2><i class="bi bi-pencil-square"></i> Editar Perfil</h2>
            <p>Actualiza tu información personal</p>
        </div>
        <a href="{{ url_for('perfil') }}" class="page-hero-btn">
            <i class="bi bi-arrow-left"></i> Volver al perfil
        </a>
    </div>

    <div class="perfil-container" style="border-top: none;">

        <div class="text-center mb-4">
            <img
                src="{% if usuario[3] %}
                        {{ url_for('static', filename=usuario[3]) }}
                     {% else %}
                        {{ url_for('static', filename='styles/imagenes/default-user.png') }}
                     {% endif %}"
                class="rounded-circle shadow"
                width="120" height="120"
                style="object-fit: cover; border: 4px solid var(--brand-mid);"
                alt="Foto de perfil"
                id="fotoPreview"
            >
        </div>

        <form method="POST" enctype="multipart/form-data">

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold" for="nombre">
                        <i class="bi bi-person me-1"></i> Nombre
                    </label>
                    <input type="text" class="form-control" id="nombre" name="nombre" value="{{ usuario[0] }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold" for="apellido">
                        <i class="bi bi-person me-1"></i> Apellido
                    </label>
                    <input type="text" class="form-control" id="apellido" name="apellido" value="{{ usuario[1] }}" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold" for="username">
                    <i class="bi bi-at me-1"></i> Username
                </label>
                <input type="text" class="form-control" id="username" name="username" value="{{ usuario[2] }}" required>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold" for="foto">
                    <i class="bi bi-camera me-1"></i> Cambiar foto de perfil
                </label>
                <input type="file" class="form-control" id="foto" name="foto" accept="image/*" onchange="previewFoto(this)">
                <small class="text-muted">Formatos permitidos: JPG, PNG, GIF</small>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn-editar">
                    <i class="bi bi-floppy me-2"></i> Guardar cambios
                </button>
            </div>

        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function previewFoto(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => {
            document.getElementById("fotoPreview").src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
    }
}
</script>
{% endblock %}
