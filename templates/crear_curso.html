{% extends "base.html" %}

{% block title %}Crear Curso{% endblock %}

{% block content %}
{% if session.get('rol') == 'profesor' %}

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">

            <h2 class="mb-4 fw-bold">Crea tu curso</h2>

            <div class="card shadow-sm border-0 p-4">

                <form method="POST" action="{{ url_for('profesor_crear_curso') }}" enctype="multipart/form-data">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Título</label>
                        <input type="text" class="form-control" name="titulo" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Descripción</label>
                        <textarea class="form-control" name="descripcion" rows="4" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Precio</label>
                        <input type="number" step="0.01" class="form-control" name="precio" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Imagen del curso</label>
                        <input type="file" name="imagen" class="form-control" accept="image/*">
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        Crear curso
                    </button>

                </form>

            </div>
        </div>
    </div>
</div>

{% else %}

<div class="container py-4">
    <div class="alert alert-danger shadow-sm">
        <h5 class="fw-bold">Acceso denegado</h5>
        <p>Solo los profesores pueden crear cursos.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary">
            Volver al inicio
        </a>
    </div>
</div>

{% endif %}
{% endblock %}
