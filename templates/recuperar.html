<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contrasena</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/login.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='imagenes/logo.jpeg') }}" type="image/x-icon">
</head>
<body>
   <div class="logo-area">
      <a href="{{ url_for('home') }}">
         <img src="{{ url_for('static', filename='styles/imagenes/logo_nova.png') }}" alt="logo">
      </a>
   </div>

   <div class="clouds">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
        <div class="cloud cloud4"></div>
        <div class="cloud cloud5"></div>
        <div class="cloud cloud6"></div>
        <div class="cloud cloud7"></div>
        <div class="cloud cloud8"></div>
    </div>

   <div class="simple-auth-shell">
      <div class="fondo">
        <div class="contenedor recuperar-box">
          <h1 class="titulo-bienvenida">Recuperar contrasena</h1>

          {% with messages = get_flashed_messages() %}
             {% if messages %}
                <div class="alert alert-info">
                   {% for message in messages %}
                      <p class="mb-0">{{ message }}</p>
                   {% endfor %}
                </div>
             {% endif %}
          {% endwith %}

          <form method="POST" action="{{ url_for('recuperar') }}">
             <div class="mb-3">
                <label for="correo" class="form-label">Ingresa tu correo electronico</label>
                <input type="email" class="form-control" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
                <small class="form-text text-muted">Te enviaremos un enlace para recuperar tu contrasena.</small>
             </div>

             <div class="btn-container">
                <button type="submit" class="btn btn-primary btn-lg">Enviar enlace</button>
                <a class="link-lateral" href="{{ url_for('login') }}">Volver al login</a>
             </div>
          </form>
        </div>
      </div>
   </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
