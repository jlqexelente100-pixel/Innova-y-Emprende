<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/login.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='styles/imagenes/logo_nova.png') }}" type="image/x-icon">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/darkmode.css') }}">
  <script src="{{ url_for('static', filename='darkmode.js') }}"></script>
</head>
<body>
   <div class="logo-area">
      <a href="{{ url_for('home') }}">
         <img src="{{ url_for('static', filename='styles/imagenes/logo_nova.png') }}" alt="logo">
      </a>
   </div>

   <button class="btn-darkmode-flotante" id="btnDarkMode" title="Cambiar tema" type="button">🌙 Oscuro</button>

   <div class="clouds">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
        <div class="cloud cloud4"></div>
        <div class="cloud cloud5"></div>
        <div class="cloud cloud6"></div>
        <div class="cloud cloud7"></div>
        <div class="cloud cloud8"></div>
    </div>

    <div class="page-shell">
      <div class="main-container">
        <div class="left-panel">
          <h3>Bienvenido</h3>
          <p>El futuro del emprendimiento comienza aqui.</p>
          <img src="{{ url_for('static', filename='styles/imagenes/Buho-apuntando-derecha.png') }}" alt="Buho">
        </div>

        <div class="right-panel">
          <div class="fondo">
            <div class="contenedor">
              <h1 class="titulo-bienvenida">Inicia Sesion</h1>

              {% with messages = get_flashed_messages(with_categories=true) %}
                 {% if messages %}
                    {% for category, message in messages %}
                       <div class="alert {% if category == 'error' %}alert-danger{% elif category == 'success' %}alert-success{% else %}alert-info{% endif %} py-2">
                          <p class="mb-0">{{ message }}</p>
                       </div>
                    {% endfor %}
                 {% endif %}
              {% endwith %}

              <form method="POST" action="{{ url_for('login') }}">
                 <div class="mb-3">
                    <label for="correo" class="form-label">Correo</label>
                    <input type="email" class="form-control" id="correo" name="correo" required>
                 </div>

                 <div class="mb-3">
                    <label for="password" class="form-label">Contrasena</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                 </div>

                 <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" value="" id="defaultCheck1">
                    <label class="form-check-label" for="defaultCheck1">
                       Recordar por 30 dias
                    </label>
                 </div>

                 <div class="btn-container">
                    <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
                    <a class="link-lateral" href="{{ url_for('registrar') }}">Crear cuenta</a>
                 </div>
              </form>

              <div class="recuperar-container mt-3">
                 <a class="link-recuperar" href="{{ url_for('recuperar') }}">¿Olvidaste tu contrasena?</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
